spring.application.name=employee-directory

# ---- Externalised application config (bound to typed beans in com.example.directory.config) ----
app.name=Employee Directory Service
app.version=1.0.0
directory.max-skills-per-employee=10
pagination.default-page-size=20
pagination.max-page-size=100

# ---- In-memory H2 ----
spring.datasource.url=jdbc:h2:mem:directorydb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50


springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi.yaml
springdoc.api-docs.path=/v3/api-docs

server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=changeit
server.ssl.key-alias=directory
